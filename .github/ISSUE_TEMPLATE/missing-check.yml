name: Missing check
description: Code that TypeScript accepts and that fails at runtime, but typerail does not report.
labels: ["missing check"]
body:
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest code sample that type-checks with typerail/tsconfig.json and should be reported.
      render: ts
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Runtime failure
      description: What happens when the code runs.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: typerail, TypeScript, ESLint and typescript-eslint versions.
