name: False positive
description: A rule or compiler flag reports code that is correct.
labels: ["false positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule or flag
      description: The rule ID or compiler error code, for example TR102, typerail/no-mutable-property-widening or TS2532.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest code sample that produces the report.
      render: ts
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why the code is correct
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: typerail, TypeScript, ESLint and typescript-eslint versions.
    validations:
      required: true
